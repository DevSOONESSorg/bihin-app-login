# 起動:  docker compose up
# 停止:  Ctrl+C のあと docker compose down
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"        # 左がPC側のポート（.envで変更できる）
    volumes:
      - ./src:/app/src              # コードを直すとすぐ反映される
      - ./public:/app/public
      - ./data:/app/data            # DBファイルはPC側の data/ に保存される
    environment:
      - TZ=Asia/Tokyo
      - APP_NAME=${APP_NAME:-備品貸出管理}
      - HOST_PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-session-secret}
      # ---- 社員マスタAPI（下の api サービス）への接続設定 ----
      - API_BASE_URL=http://api:3000          # コンテナ同士はサービス名で通信できる
      - API_AUTH_MODE=${API_AUTH_MODE:-none}
      - API_KEY=${API_KEY:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
    depends_on:
      - api

  # 社員マスタAPI（auth-lab の api をそのままコピー）
  api:
    build: ./api
    ports:
      - "${API_PORT:-3001}:3000"
    volumes:
      - ./api/src:/app/src
    environment:
      - TZ=Asia/Tokyo
      - HOST_PORT=${API_PORT:-3001}
      - API_AUTH_MODE=${API_AUTH_MODE:-none}
      - API_KEY=${API_KEY:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-10m}
